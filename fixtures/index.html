<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Tag Inspector fixture</title><style>body{font:16px system-ui;max-width:800px;margin:50px auto;line-height:1.8}button,input{padding:10px;margin:5px}section{border-top:1px solid #ddd;padding:20px 0}</style></head><body><h1>Tag Inspector · deterministic fixture</h1><p>All actions stay local. Open the extension, enable capture, and try each control.</p><section><button id="lead">Push generate_lead</button><button id="batch">Push ecommerce</button><button id="message">Send postMessage</button><button id="dni">Replace phone</button><button id="route">SPA navigation</button></section><section><a id="phone" href="tel:+14155550199">+1 (415) 555-0199</a><br><a href="mailto:hello@example.com">hello@example.com</a></section><section class="wpcf7"><form id="contact" aria-label="Contact form"><label>Email <input type="email" required name="email"></label><button type="submit">Send locally</button><p id="result"></p></form></section><p>Network parsers are covered by deterministic unit fixtures. This page deliberately does not send requests to analytics companies.</p><iframe src="frame.html" title="Child frame"></iframe><script>window.dataLayer=[{event:'fixture_ready'}];window.fbq=function(){};window.fbq('init','123456789');window.uetq=[];window.ctm={};document.querySelector('#lead').onclick=()=>dataLayer.push({event:'generate_lead',form_id:'contact',email:'secret@example.com'});document.querySelector('#batch').onclick=()=>dataLayer.push({event:'purchase',ecommerce:{value:99,currency:'USD',items:[{item_id:'SKU-1',quantity:1}]}});document.querySelector('#message').onclick=()=>window.postMessage({type:'fixture_message',event:'hello',password:'never-store-this'},location.origin);document.querySelector('#dni').onclick=()=>{const a=document.querySelector('#phone');a.href='tel:+14155550123';a.textContent='+1 (415) 555-0123'};document.querySelector('#route').onclick=()=>history.pushState({},'', '?route=next');document.querySelector('form').onsubmit=e=>{e.preventDefault();document.querySelector('#result').textContent='Local fixture accepted. No request sent.'};</script></body></html>
